<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S.</title>
<style>
  :root {
    --bg: #03070d;
    --bg2: #061019;
    --cyan: #5be8ff;
    --cyan-dim: #2a7f96;
    --cyan-deep: #0aa6c9;
    --glow: rgba(91, 232, 255, 0.55);
    --line: rgba(91, 232, 255, 0.18);
    --panel: rgba(6, 20, 30, 0.55);
    --text: #cfe8f2;
    --warn: #ffb454;
    --ok: #6dffb0;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
  }

  .backdrop {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 50% 42%, rgba(11, 60, 82, 0.55) 0%, rgba(3, 7, 13, 0.9) 55%, #02040a 100%),
      linear-gradient(0deg, #02040a, #03070d);
    z-index: 0;
  }
  .grid {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 46px 46px;
    mask-image: radial-gradient(circle at 50% 45%, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.15) 70%, transparent 100%);
    opacity: 0.4;
    z-index: 0;
  }

  .app {
    position: relative;
    z-index: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 22px;
    flex: 0 0 auto;
    gap: 10px;
  }
  .brand {
    display: flex;
    align-items: baseline;
    gap: 12px;
    letter-spacing: 0.5em;
    font-weight: 600;
    font-size: 20px;
    color: var(--cyan);
    text-shadow: 0 0 18px var(--glow);
    min-width: 0;
  }
  .brand small {
    letter-spacing: 0.3em;
    font-size: 10px;
    color: var(--cyan-dim);
    text-shadow: none;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .topbar-actions { display: flex; gap: 10px; flex: 0 0 auto; }
  .iconbtn {
    background: rgba(6, 26, 36, 0.6);
    border: 1px solid var(--line);
    color: var(--cyan);
    width: 42px; height: 42px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 18px;
    display: grid; place-items: center;
    transition: box-shadow .2s, border-color .2s, transform .15s;
  }
  .iconbtn:hover { box-shadow: 0 0 16px var(--glow); border-color: var(--cyan); transform: translateY(-1px); }
  .iconbtn.text { font-size: 13px; font-weight: 600; letter-spacing: 0.06em; }
  .iconbtn.on { border-color: var(--cyan); box-shadow: 0 0 16px var(--glow); color: #eafaff; background: rgba(12,46,60,0.8); }

  .main {
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: 1fr 1.25fr 1fr;
    gap: 18px;
    padding: 0 22px 12px;
    min-height: 0;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    min-height: 0;
    backdrop-filter: blur(3px);
  }
  .panel h2 {
    margin: 0 0 10px;
    font-size: 12px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--cyan);
    font-weight: 600;
    opacity: 0.85;
  }

  .center {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    min-height: 0;
  }
  .reactor-wrap {
    position: relative;
    width: min(46vh, 90%);
    aspect-ratio: 1 / 1;
    display: grid;
    place-items: center;
  }
  #reactor { width: 100%; height: 100%; display: block; }
  .status {
    text-align: center;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    font-size: 13px;
    color: var(--cyan);
    text-shadow: 0 0 12px var(--glow);
    min-height: 18px;
    padding: 0 10px;
  }
  .status.thinking { color: var(--warn); text-shadow: 0 0 12px rgba(255,180,84,.5); }
  .status.error { color: #ff6b6b; text-shadow: none; }

  .transcript {
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding-right: 4px;
  }
  .msg { line-height: 1.5; font-size: 14px; }
  .msg .who {
    font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
    display: block; margin-bottom: 3px; opacity: 0.7;
  }
  .msg.user { text-align: right; }
  .msg.user .who { color: #9fd0dd; }
  .msg.user .body {
    display: inline-block;
    background: rgba(20, 44, 56, 0.6);
    border: 1px solid var(--line);
    border-radius: 12px 12px 2px 12px;
    padding: 8px 12px;
    max-width: 90%;
  }
  .msg.jarvis .who { color: var(--cyan); }
  .msg.jarvis .body {
    display: inline-block;
    background: rgba(9, 30, 42, 0.55);
    border: 1px solid var(--line);
    border-radius: 12px 12px 12px 2px;
    padding: 8px 12px;
    max-width: 95%;
    white-space: pre-wrap;
    color: #dff4fb;
  }
  .msg.system .body { color: var(--warn); font-size: 13px; opacity: 0.9; }
  .msg.jarvis.speakable .body { cursor: pointer; }
  .msg.jarvis.speakable .body::before { content: "🔊 "; opacity: 0.75; font-size: 12px; }
  .msg.jarvis.speakable .body:active { box-shadow: 0 0 12px var(--glow); }

  .goals { overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 2px; }
  .goal-empty { color: var(--cyan-dim); font-size: 13px; font-style: italic; }
  .goal-card {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px 10px;
    background: rgba(5, 18, 26, 0.4);
    transition: border-color .2s, box-shadow .2s;
  }
  .goal-card.active {
    border-color: var(--cyan-deep);
    box-shadow: inset 0 0 14px rgba(91,232,255,0.08), 0 0 10px rgba(91,232,255,0.12);
  }
  .goal-head { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .goal-head .name { flex: 1 1 auto; font-size: 14px; color: #dff4fb; word-break: break-word; }
  .goal-card.active .goal-head .name { color: #fff; text-shadow: 0 0 10px var(--glow); }
  .goal-del {
    background: none; border: none; color: var(--cyan-dim);
    cursor: pointer; font-size: 18px; line-height: 1;
    padding: 0 4px; border-radius: 6px; flex: 0 0 auto;
  }
  .goal-del:hover { color: #ff6b6b; }
  .steps { list-style: none; margin: 8px 0 2px; padding: 0; }
  .steps li {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 7px 4px;
    border-bottom: 1px dashed var(--line);
    cursor: pointer;
    font-size: 13.5px;
    line-height: 1.4;
  }
  .steps li:last-child { border-bottom: none; }
  .steps li:hover { background: rgba(91,232,255,0.05); }
  .steps .box {
    flex: 0 0 auto;
    width: 18px; height: 18px;
    border: 1px solid var(--cyan-deep);
    border-radius: 5px;
    display: grid; place-items: center;
    color: var(--ok);
    font-size: 13px;
    margin-top: 1px;
  }
  .steps li.done .box { background: rgba(109,255,176,0.15); border-color: var(--ok); }
  .steps li.done .txt { text-decoration: line-through; opacity: 0.55; }

  .controls {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 14px;
    justify-content: center;
    padding: 6px 22px 20px;
  }
  .mic {
    position: relative;
    width: 64px; height: 64px;
    border-radius: 50%;
    border: 1px solid var(--cyan-deep);
    background: radial-gradient(circle at 50% 40%, rgba(20,60,80,0.9), rgba(5,20,28,0.9));
    color: var(--cyan);
    font-size: 24px;
    cursor: pointer;
    display: grid; place-items: center;
    box-shadow: 0 0 18px rgba(91,232,255,0.25);
    transition: transform .12s, box-shadow .2s;
    flex: 0 0 auto;
  }
  .mic:hover { transform: scale(1.05); }
  .mic.active {
    color: #fff;
    border-color: #ff5d6c;
    box-shadow: 0 0 26px rgba(255,93,108,0.7);
    animation: micpulse 1.1s ease-in-out infinite;
  }
  .mic:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
  @keyframes micpulse {
    0%,100% { box-shadow: 0 0 20px rgba(255,93,108,0.5); }
    50% { box-shadow: 0 0 34px rgba(255,93,108,0.9); }
  }
  .textwrap {
    flex: 1 1 auto;
    max-width: 640px;
    display: flex;
    gap: 10px;
    align-items: center;
    background: rgba(6, 22, 32, 0.7);
    border: 1px solid var(--line);
    border-radius: 30px;
    padding: 6px 6px 6px 18px;
  }
  #textInput {
    flex: 1 1 auto;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 15px;
    padding: 8px 0;
    min-width: 0;
  }
  #textInput::placeholder { color: var(--cyan-dim); }
  .send {
    border: none;
    background: var(--cyan-deep);
    color: #021018;
    font-weight: 700;
    border-radius: 24px;
    padding: 10px 18px;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: box-shadow .2s, background .2s;
    flex: 0 0 auto;
  }
  .send:hover { box-shadow: 0 0 16px var(--glow); background: var(--cyan); }

  .overlay {
    position: fixed; inset: 0;
    background: rgba(2, 6, 12, 0.78);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
    backdrop-filter: blur(4px);
  }
  .overlay.open { display: flex; }
  .dialog {
    width: min(520px, 92vw);
    background: linear-gradient(180deg, rgba(8,26,36,0.96), rgba(4,14,20,0.96));
    border: 1px solid var(--cyan-deep);
    border-radius: 16px;
    padding: 24px 26px;
    box-shadow: 0 0 40px rgba(91,232,255,0.25);
  }
  .dialog h2 { margin: 0 0 6px; color: var(--cyan); letter-spacing: 0.2em; font-size: 16px; }
  .dialog p { font-size: 13px; line-height: 1.55; color: #a9d3df; }
  .dialog a { color: var(--cyan); }
  .dialog label { display: block; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--cyan-dim); margin: 16px 0 6px; }
  .dialog input {
    width: 100%;
    background: rgba(3, 12, 18, 0.9);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--text);
    padding: 11px 12px;
    font-size: 14px;
    outline: none;
  }
  .dialog input:focus { border-color: var(--cyan); box-shadow: 0 0 12px rgba(91,232,255,0.25); }
  .dialog select {
    width: 100%;
    background: rgba(3, 12, 18, 0.9);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--text);
    padding: 11px 12px;
    font-size: 14px;
    outline: none;
  }
  .dialog select:focus { border-color: var(--cyan); box-shadow: 0 0 12px rgba(91,232,255,0.25); }
  .dialog .note {
    margin-top: 14px; font-size: 12px; color: var(--warn);
    background: rgba(255,180,84,0.08); border: 1px solid rgba(255,180,84,0.25);
    border-radius: 8px; padding: 10px 12px; line-height: 1.5;
  }
  .dialog .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
  .btn {
    border: 1px solid var(--line);
    background: rgba(6,22,32,0.7);
    color: var(--cyan);
    border-radius: 8px;
    padding: 10px 18px;
    cursor: pointer;
    font-size: 14px;
    transition: box-shadow .2s, border-color .2s;
  }
  .btn:hover { border-color: var(--cyan); box-shadow: 0 0 12px var(--glow); }
  .btn.primary { background: var(--cyan-deep); color: #021018; font-weight: 700; border-color: var(--cyan-deep); }

  @media (max-width: 900px) {
    .main {
      grid-template-columns: 1fr;
      grid-template-rows: auto 1fr auto;
      overflow-y: auto;
    }
    .center { order: -1; }
    .reactor-wrap { width: min(40vh, 70%); }
    .panel { max-height: 34vh; }
    .brand small { display: none; }
  }
</style>
</head>
<body>
  <div class="backdrop"></div>
  <div class="grid"></div>

  <div class="app">
    <header class="topbar">
      <div class="brand">J.A.R.V.I.S. <small id="brandSub">Just A Rather Very Intelligent System</small></div>
      <div class="topbar-actions">
        <button class="iconbtn text" id="langBtn" title="Sprache wechseln / Switch language">DE</button>
        <button class="iconbtn" id="handsFreeBtn" title="Freisprechen">∞</button>
        <button class="iconbtn" id="settingsBtn" title="Einstellungen" aria-label="Einstellungen">⚙</button>
      </div>
    </header>

    <div class="main">
      <section class="panel" id="goalPanel">
        <h2 id="goalHeading">Aktuelle Ziele</h2>
        <div class="goals" id="goals"></div>
      </section>

      <section class="center">
        <div class="reactor-wrap">
          <canvas id="reactor"></canvas>
        </div>
        <div class="status" id="status">Systeme bereit</div>
      </section>

      <section class="panel">
        <h2 id="dialogHeading">Dialog</h2>
        <div class="transcript" id="transcript"></div>
      </section>
    </div>

    <div class="controls">
      <button class="mic" id="micBtn" title="Sprechen (Push-to-talk)" aria-label="Mikrofon">🎙</button>
      <div class="textwrap">
        <input id="textInput" type="text" placeholder="Sprich mit JARVIS oder tippe hier …" autocomplete="off">
        <button class="send" id="sendBtn">Senden</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="dialog">
      <h2 id="setTitle">EINSTELLUNGEN</h2>
      <p id="setIntro"></p>
      <label id="keyLabel" for="keyInput">Google Gemini API-Schlüssel (kostenlos)</label>
      <input id="keyInput" type="password" placeholder="AIza…" autocomplete="off">
      <div class="note" id="setNote"></div>
      <label id="voiceLabel" for="voiceSelect">Stimme</label>
      <select id="voiceSelect"></select>
      <div class="row">
        <button class="btn" id="clearKeyBtn">Key löschen</button>
        <button class="btn primary" id="saveKeyBtn">Speichern</button>
      </div>
    </div>
  </div>

<script>
"use strict";

/* ================================================================
   Konfiguration – kostenlose KI über Google Gemini
   ================================================================ */
const GEMINI_BASE = "https://generativelanguage.googleapis.com/v1beta";
// Bevorzugt schnelle, kostenlos großzügige Flash-Modelle; das erste
// funktionierende wird gemerkt. Selbstheilend bei Namensänderungen.

// Bevorzugte Stimmen für den JARVIS-Klang (ruhig, maennlich, moeglichst britisch).
const VOICE_PREFS = {
  en: ["Daniel", "Arthur", "Oliver", "Google UK English Male", "George", "Ryan", "Male"],
  de: ["Markus", "Yannick", "Conrad", "Google Deutsch", "Male", "Männlich"]
};
let selectedVoiceName = localStorage.getItem("jarvis_voice") || "";

const SYSTEM_PROMPTS = {

/* ================================================================
   Reaktor-Animation (Canvas)
   ================================================================ */
const canvas = $("reactor");
const ctx = canvas.getContext("2d");
let dpr = Math.max(1, window.devicePixelRatio || 1);

function sizeCanvas() {
  const rect = canvas.getBoundingClientRect();
  dpr = Math.max(1, window.devicePixelRatio || 1);
  canvas.width = Math.round(rect.width * dpr);
  canvas.height = Math.round(rect.height * dpr);
}
window.addEventListener("resize", sizeCanvas);

let angle = 0;
function drawReactor(ts) {
  const w = canvas.width, h = canvas.height;
  if (!w || !h) { requestAnimationFrame(drawReactor); return; }
  const cx = w / 2, cy = h / 2;
  const R = Math.min(w, h) * 0.44;
  const time = ts / 1000;

  ctx.clearRect(0, 0, w, h);

  let spin = 0.15, pulseSpeed = 1.4, pulseAmp = 0.05, hue = "cyan";
  if (state === "listening") { spin = 0.25; pulseSpeed = 3.2; pulseAmp = 0.05 + micLevel * 0.5; }
  else if (state === "thinking") { spin = 0.9; pulseSpeed = 6; pulseAmp = 0.12; hue = "warn"; }
  else if (state === "speaking") { spin = 0.35; pulseSpeed = 5; pulseAmp = 0.14; }

  angle += spin * 0.016;
  const pulse = 1 + Math.sin(time * pulseSpeed) * pulseAmp;

  const CY = "91, 232, 255";
  const WA = "255, 180, 84";
  const col = hue === "warn" ? WA : CY;

  ring(cx, cy, R, 2 * dpr, "rgba(" + col + ",0.35)");
  segmentRing(cx, cy, R * 0.9, 18, angle, "rgba(" + col + ",0.8)", 3 * dpr);
  tickRing(cx, cy, R * 0.72, 60, -angle * 0.6, "rgba(" + col + ",0.5)");
  polygon(cx, cy, R * 0.5 * pulse, 6, angle * 1.5, "rgba(" + col + ",0.6)", 2 * dpr);
  polygon(cx, cy, R * 0.5 * pulse, 6, -angle * 1.5 + 0.5, "rgba(" + col + ",0.35)", 2 * dpr);
  ring(cx, cy, R * 0.36 * pulse, 3 * dpr, "rgba(" + col + ",0.9)");

  const coreR = R * 0.26 * pulse;
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreR);
  g.addColorStop(0, "rgba(255,255,255,0.95)");
  g.addColorStop(0.35, "rgba(" + col + ",0.9)");
  g.addColorStop(1, "rgba(" + col + ",0)");
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(cx, cy, coreR, 0, Math.PI * 2);
  ctx.fill();

  requestAnimationFrame(drawReactor);
}

function ring(cx, cy, r, lw, style) {
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.lineWidth = lw;
  ctx.strokeStyle = style;
  ctx.stroke();
}
function segmentRing(cx, cy, r, segments, rot, style, lw) {
  ctx.lineWidth = lw;
  ctx.strokeStyle = style;
  const gap = 0.12;
  const step = (Math.PI * 2) / segments;
  for (let i = 0; i < segments; i++) {
    ctx.beginPath();
    ctx.arc(cx, cy, r, rot + i * step + gap, rot + (i + 1) * step - gap);
    ctx.stroke();
  }
}
function tickRing(cx, cy, r, ticks, rot, style) {
  ctx.strokeStyle = style;
  ctx.lineWidth = 1.5 * dpr;
  for (let i = 0; i < ticks; i++) {
    const a = rot + (i / ticks) * Math.PI * 2;
    const inner = r - 6 * dpr;
    const outer = r + (i % 5 === 0 ? 10 * dpr : 5 * dpr);
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * inner, cy + Math.sin(a) * inner);
    ctx.lineTo(cx + Math.cos(a) * outer, cy + Math.sin(a) * outer);
    ctx.stroke();
  }
}
function polygon(cx, cy, r, sides, rot, style, lw) {
  ctx.beginPath();
  for (let i = 0; i <= sides; i++) {
    const a = rot + (i / sides) * Math.PI * 2;
    const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.lineWidth = lw;
  ctx.strokeStyle = style;
  ctx.stroke();
}

let ttsVoice = null;
function pickVoice() {
  if (!("speechSynthesis" in window)) return;
  const voices = speechSynthesis.getVoices();
  if (!voices.length) return;
  // 1) ausdruecklich gewaehlte Stimme
  if (selectedVoiceName) {
    const chosen = voices.find(v => v.name === selectedVoiceName);
    if (chosen) { ttsVoice = chosen; return; }
  }
  // 2) automatische Bevorzugung (maennlich, fuer Englisch moeglichst britisch)
  const base = lang === "de" ? "de" : "en";
  const inLang = voices.filter(v => (v.lang || "").toLowerCase().startsWith(base));
  const ordered = base === "en"
    ? inLang.slice().sort((a, b) => (/(gb|uk)/i.test(b.lang) ? 1 : 0) - (/(gb|uk)/i.test(a.lang) ? 1 : 0))
    : inLang;
  const prefs = VOICE_PREFS[base] || [];
  for (const name of prefs) {
    const m = ordered.find(v => v.name.toLowerCase().includes(name.toLowerCase()));
    if (m) { ttsVoice = m; return; }
  }
  ttsVoice = ordered[0] || null;
}
function populateVoiceSelect() {
  const sel = document.getElementById("voiceSelect");
  if (!sel || !("speechSynthesis" in window)) return;
  const voices = speechSynthesis.getVoices();
  sel.innerHTML = "";
  const auto = document.createElement("option");
  auto.value = "";
  auto.textContent = lang === "de" ? "Automatisch (empfohlen)" : "Automatic (recommended)";
  sel.appendChild(auto);
  voices.forEach(v => {
    const o = document.createElement("option");
    o.value = v.name;
    o.textContent = v.name + " (" + v.lang + ")";
    if (v.name === selectedVoiceName) o.selected = true;
    sel.appendChild(o);
  });
}
if ("speechSynthesis" in window) {
  pickVoice();
  speechSynthesis.onvoiceschanged = () => { pickVoice(); populateVoiceSelect(); };
}

let speechPrimed = false;
function primeSpeech() {
  // iOS/Safari geben Sprachausgabe nur frei, wenn speak() einmal aus einer
  // echten Nutzer-Geste heraus aufgerufen wurde. Diese stille Aufwaermung
  // beim ersten Antippen schaltet die spaeteren (asynchronen) Antworten frei.
  if (speechPrimed || !("speechSynthesis" in window)) return;
  speechPrimed = true;
  try {
    const warm = new SpeechSynthesisUtterance(" ");
    warm.lang = lang === "de" ? "de-DE" : "en-US";
    speechSynthesis.speak(warm);
  } catch (_) {}
}
["pointerdown", "touchend", "click", "keydown"].forEach(ev =>
  document.addEventListener(ev, primeSpeech, { passive: true })
);

function speak(text) {
  if (!("speechSynthesis" in window)) { setState("idle"); handsFreeContinue(); return; }
  try { speechSynthesis.resume(); } catch (_) {}
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang === "de" ? "de-DE" : "en-US";
  if (ttsVoice) u.voice = ttsVoice;
  u.rate = 1.9;    // etwa doppeltes Tempo
  u.pitch = 0.85;  // etwas tiefer fuer den JARVIS-Klang
  u.onstart = () => setState("speaking");
  u.onend = () => { setState("idle"); handsFreeContinue(); };
  u.onerror = () => { setState("idle"); handsFreeContinue(); };
  speechSynthesis.speak(u);
}

let goals = [];
let activeGoalId = null;

function saveGoals() { localStorage.setItem(LS_GOALS, JSON.stringify({ goals, activeGoalId })); }

function loadGoals() {
  try {
    const raw = localStorage.getItem(LS_GOALS);
    if (raw) {
      const parsed = JSON.parse(raw);
      goals = Array.isArray(parsed.goals) ? parsed.goals : [];
      activeGoalId = parsed.activeGoalId || (goals[0] && goals[0].id) || null;
    } else {
      const old = localStorage.getItem(LS_GOAL_OLD);
      if (old) {
        const g = JSON.parse(old);
        if (g && g.title) {
          const ng = { id: "legacy", title: g.title, steps: g.steps || [] };
          goals = [ng]; activeGoalId = "legacy"; saveGoals();
        }
      }
    }
  } catch (e) { /* ignorieren */ }
  renderGoals();
}

function renderGoals() {
  goalsEl.innerHTML = "";
  if (!goals.length) {
    const d = document.createElement("div");
    d.className = "goal-empty";
    d.textContent = t("goalEmpty");
    goalsEl.appendChild(d);
    return;
  }
  goals.forEach(g => {
    const card = document.createElement("div");
    card.className = "goal-card" + (g.id === activeGoalId ? " active" : "");

    const head = document.createElement("div");
    head.className = "goal-head";
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = g.title;
    const del = document.createElement("button");
    del.className = "goal-del";
    del.textContent = "×";
    del.title = t("deleteGoal");
    head.appendChild(name);
    head.appendChild(del);

    head.addEventListener("click", (e) => {
      if (e.target === del) return;
      activeGoalId = g.id; saveGoals(); renderGoals();
    });
    del.addEventListener("click", (e) => {
      e.stopPropagation();
      goals = goals.filter(x => x.id !== g.id);
      if (activeGoalId === g.id) activeGoalId = (goals[0] && goals[0].id) || null;
      saveGoals(); renderGoals();
    });
    card.appendChild(head);

    if (g.id === activeGoalId && g.steps && g.steps.length) {
      const ul = document.createElement("ul");
      ul.className = "steps";
      g.steps.forEach((step) => {
        const li = document.createElement("li");
        if (step.done) li.classList.add("done");
        const box = document.createElement("span");
        box.className = "box";
        box.textContent = step.done ? "✓" : "";
        const txt = document.createElement("span");
        txt.className = "txt";
        txt.textContent = step.text;
        li.appendChild(box);
        li.appendChild(txt);
        li.addEventListener("click", () => { step.done = !step.done; saveGoals(); renderGoals(); });
        ul.appendChild(li);
      });
      card.appendChild(ul);
    }
    goalsEl.appendChild(card);
  });
}

const GOAL_HINTS = {
  de: /\b(ziel|verdien\w*|euro|erreichen|schaffen|m[oö]chte|will\s+ich|lernen|abnehmen|sparen|projekt|starten|aufbauen)\b/i,
  en: /\b(goal|earn\w*|money|dollars?|euros?|want\s+to|would\s+like|learn|save|build|start|project|achieve|lose\s+weight)\b/i
};
function looksLikeGoal(text) {
  return GOAL_HINTS[lang].test(text) || /[€$]/.test(text);
}
function cleanGoalTitle(text) {
  let s = text.trim();
  s = s.replace(/^(jarvis[,:\s]+)/i, "");
  if (lang === "de") {
    s = s.replace(/^(mein ziel ist[,:\s]*(dass|es,)?\s*)/i, "");
    s = s.replace(/^(ich (m[oö]chte|will)[,:\s]*)/i, "");
  } else {
    s = s.replace(/^(my goal is[,:\s]*(to|that)?\s*)/i, "");
    s = s.replace(/^(i (want to|would like to|wanna|'d like to)[,:\s]*)/i, "");
  }
  s = s.trim();
  if (s.length > 120) s = s.slice(0, 117) + "…";
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function parseSteps(reply) {
  const steps = [];
  reply.split(/\n/).forEach(line => {
    const m = line.match(/^\s*\d+[\.\)]\s+(.*\S)\s*$/);
    if (m) steps.push({ text: m[1].trim(), done: false });
  });
  return steps;
}
const normTitle = (s) => s.toLowerCase().replace(/[^\p{L}\p{N}\s]/gu, "").replace(/\s+/g, " ").trim();

function maybeUpdateGoal(userText, reply) {
  const steps = parseSteps(reply);
  if (looksLikeGoal(userText)) {
    const title = cleanGoalTitle(userText);
    const active = goals.find(g => g.id === activeGoalId);
    if (active) {
      const a = normTitle(active.title), b = normTitle(title);
      if (a && b && (a.includes(b) || b.includes(a))) {
        if (steps.length) active.steps = steps;
        saveGoals(); renderGoals();
        return;
      }
    }
    const g = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), title, steps };
    goals.push(g);
    activeGoalId = g.id;
    saveGoals(); renderGoals();
  } else {
    const active = goals.find(g => g.id === activeGoalId);
    if (active && steps.length && (!active.steps || !active.steps.length)) {
      active.steps = steps; saveGoals(); renderGoals();
    }
  }
}

/* ================================================================
   KI-Anfrage (Google Gemini, kostenlos)
   ================================================================ */
function showApiError(status, detail) {
  const L = I18N[lang];
  let msg;
  if (status === 400 || status === 401 || status === 403) msg = L.errKey;
  else if (status === 429) msg = L.err429;
  else if (status >= 500) msg = L.err500 + " (HTTP " + status + ")";
  else msg = L.errGeneric(status);
  if (detail) msg += L.errDetails + detail;
  addMessage("system", msg);
  statusEl.className = "status error";
  statusEl.textContent = L.errorLabel;
  setTimeout(() => setState("idle"), 200);
}

async function askAI(userText) {
  const key = getKey();
  const L = I18N[lang];
  if (!key) {
    addMessage("system", L.noKey);
    setState("idle");
    openSettings();
    return;
  }

  conversation.push({ role: "user", parts: [{ text: userText }] });
  setState("thinking");

  const body = {
    systemInstruction: { parts: [{ text: SYSTEM_PROMPTS[lang] }] },
    contents: conversation,
    generationConfig: { maxOutputTokens: 1024, temperature: 0.7 }
  };

  const candidates = resolvedModel
    ? [resolvedModel].concat(MODEL_CANDIDATES.filter(m => m !== resolvedModel))
    : MODEL_CANDIDATES.slice();

  try {
    let lastStatus = 0, lastDetail = "";
    for (const model of candidates) {
      const url = GEMINI_BASE + "/models/" + model + ":generateContent";
      const res = await fetch(url, {
        method: "POST",
        headers: { "content-type": "application/json", "x-goog-api-key": key },
        body: JSON.stringify(body)
      });

      // Modell nicht verfügbar (404), Kontingent erschöpft (429) oder Server-Problem (5xx)
      // -> naechstes Modell probieren; ein anderes Modell hat oft ein eigenes Freikontingent
      if (res.status === 404 || res.status === 429 || res.status >= 500) {
        try { const e = await res.json(); lastDetail = (e.error && e.error.message) || ""; } catch (_) {}
        lastStatus = res.status;
        continue;
      }

      if (!res.ok) {
        let detail = "";
        try { const e = await res.json(); detail = e.error && e.error.message ? e.error.message : ""; } catch (_) {}
        conversation.pop();
        showApiError(res.status, detail);
        return;
      }

      const data = await res.json();
      resolvedModel = model;
      localStorage.setItem(LS_MODEL, model);

      const cand = (data.candidates && data.candidates[0]) || null;
      let reply = "";
      if (cand && cand.content && cand.content.parts) {
        reply = cand.content.parts.map(p => p.text || "").join("").trim();
      }
      if (!reply) {
        const blocked = (data.promptFeedback && data.promptFeedback.blockReason) ||
                        (cand && cand.finishReason && cand.finishReason !== "STOP");
        conversation.pop();
        addMessage("system", blocked ? L.blocked : L.errGeneric(200));
        statusEl.className = "status error";
        statusEl.textContent = L.errorLabel;
        setTimeout(() => setState("idle"), 200);
        return;
      }

      conversation.push({ role: "model", parts: [{ text: reply }] });
      addMessage("jarvis", reply);
      maybeUpdateGoal(userText, reply);
      speak(reply);
      maybeShowTtsHint();
      return;
    }
    // Alle Modelle nicht erreichbar (404 oder 5xx)
    conversation.pop();
    showApiError(lastStatus || 404, lastDetail);
  } catch (err) {
    conversation.pop();
    addMessage("system", L.errNet(err && err.message ? err.message : err));
    statusEl.className = "status error";
    statusEl.textContent = L.errorLabel;
    setTimeout(() => setState("idle"), 200);
  }
}

/* ================================================================
   Spracheingabe (Web Speech API) + Freisprech-Modus
   ================================================================ */
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let listening = false;
let gotFinal = false;
let handsFree = localStorage.getItem(LS_HANDSFREE) === "1";

function startListening() {
  if (!recognition || listening) return;
  if (!getKey()) return;
  if (state === "speaking" && "speechSynthesis" in window) speechSynthesis.cancel();
  try { recognition.start(); } catch (_) { /* bereits gestartet */ }
}
function handsFreeContinue() {
  if (handsFree && getKey() && !listening) {
    setTimeout(() => {
      if (handsFree && state === "idle" && !listening && getKey()) startListening();
    }, 500);
  }
}
function updateHandsFreeBtn() {
  handsFreeBtn.classList.toggle("on", handsFree);
  handsFreeBtn.title = handsFree ? t("handsFreeOn") : t("handsFreeOff");
}

if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.lang = lang === "de" ? "de-DE" : "en-US";
  recognition.interimResults = true;
  recognition.continuous = false;

  recognition.onstart = () => {
    gotFinal = false;
    listening = true;
    micBtn.classList.add("active");
    setState("listening");
    startMicAnalyser();
  };
  recognition.onresult = (event) => {
    let interim = "", final = "";
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const r = event.results[i];
      if (r.isFinal) final += r[0].transcript;
      else interim += r[0].transcript;
    }
    if (interim) setState("listening", "„" + interim.trim() + "“");
    if (final.trim()) {
      gotFinal = true;
      recognition.stop();
      submitText(final.trim());
    }
  };
  recognition.onerror = (e) => {
    gotFinal = true;
    listening = false;
    micBtn.classList.remove("active");
    stopMicAnalyser();
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      addMessage("system", t("micDenied"));
      handsFree = false;
      localStorage.setItem(LS_HANDSFREE, "0");
      updateHandsFreeBtn();
    } else if ((e.error === "no-speech" || e.error === "aborted") && handsFree && getKey()) {
      gotFinal = false;
    }
    if (state === "listening") setState("idle");
  };
  recognition.onend = () => {
    listening = false;
    micBtn.classList.remove("active");
    stopMicAnalyser();
    if (!gotFinal && state === "listening") setState("idle");
    if (handsFree && !gotFinal && getKey()) {
      setTimeout(() => {
        if (handsFree && state === "idle" && !listening && getKey()) startListening();
      }, 600);
    }
  };

  micBtn.addEventListener("click", () => {
    if (listening) { recognition.stop(); return; }
    startListening();
  });
} else {
  micBtn.disabled = true;
  micBtn.title = t("micUnsupported");
}

handsFreeBtn.addEventListener("click", () => {
  if (!recognition) { addMessage("system", t("micUnsupported")); return; }
  handsFree = !handsFree;
  localStorage.setItem(LS_HANDSFREE, handsFree ? "1" : "0");
  updateHandsFreeBtn();
  if (handsFree) { if (getKey() && state === "idle") startListening(); }
  else { if (listening) recognition.stop(); }
});

/* ---------- Mikrofon-Amplitude für die Reaktor-Pulsierung ---------- */
let audioCtx = null, analyser = null, micStream = null, micRAF = null;
async function startMicAnalyser() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const src = audioCtx.createMediaStreamSource(micStream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    src.connect(analyser);
    const buf = new Uint8Array(analyser.frequencyBinCount);
    const tick = () => {
      if (!analyser) return;
      analyser.getByteTimeDomainData(buf);
      let sum = 0;
      for (let i = 0; i < buf.length; i++) { const v = (buf[i] - 128) / 128; sum += v * v; }
      micLevel = Math.min(1, Math.sqrt(sum / buf.length) * 3.5);
      micRAF = requestAnimationFrame(tick);
    };
    tick();
  } catch (_) { /* Amplitude ist optional */ }
}
function stopMicAnalyser() {
  micLevel = 0;
  if (micRAF) { cancelAnimationFrame(micRAF); micRAF = null; }
  analyser = null;
  if (micStream) { micStream.getTracks().forEach(tr => tr.stop()); micStream = null; }
}

/* ================================================================
   Sprache umschalten
   ================================================================ */
function applyLanguage() {
  document.documentElement.lang = t("htmlLang");
  $("brandSub").textContent = t("subtitle");
  $("goalHeading").textContent = t("goalHeading");
  $("dialogHeading").textContent = t("dialogHeading");
  textInput.placeholder = t("placeholder");
  sendBtn.textContent = t("send");
  micBtn.title = recognition ? t("micTitle") : t("micUnsupported");
  langBtn.textContent = lang.toUpperCase();
  $("setTitle").textContent = t("settingsTitle");
  $("setIntro").textContent = t("settingsIntro");
  $("keyLabel").textContent = t("keyLabel");
  keyInput.placeholder = t("keyPlaceholder");
  $("setNote").textContent = t("securityNote");
  $("clearKeyBtn").textContent = t("clearKey");
  $("saveKeyBtn").textContent = t("saveKey");
  $("voiceLabel").textContent = t("voiceLabel");
  populateVoiceSelect();
  if (recognition) recognition.lang = lang === "de" ? "de-DE" : "en-US";
  updateHandsFreeBtn();
  pickVoice();
  setState(state);
  renderGoals();
}
langBtn.addEventListener("click", () => {
  lang = lang === "de" ? "en" : "de";
  localStorage.setItem(LS_LANG, lang);
  applyLanguage();
});

/* ================================================================
   Einstellungen
   ================================================================ */
function openSettings() {
  keyInput.value = getKey();
  populateVoiceSelect();
  overlay.classList.add("open");
  keyInput.focus();
}
function closeSettings() { overlay.classList.remove("open"); }

$("settingsBtn").addEventListener("click", openSettings);
$("saveKeyBtn").addEventListener("click", () => {
  saveKey(keyInput.value);
  closeSettings();
  if (getKey()) addMessage("system", t("keySaved"));
});
$("clearKeyBtn").addEventListener("click", () => {
  localStorage.removeItem(LS_KEY);
  keyInput.value = "";
});
$("voiceSelect").addEventListener("change", (e) => {
  selectedVoiceName = e.target.value;
  localStorage.setItem("jarvis_voice", selectedVoiceName);
  pickVoice();
  // kurze Hoerprobe – laeuft innerhalb der Klick-Geste, spielt daher auch auf iOS
  speak(lang === "de" ? "Systeme bereit, Sir." : "Systems ready, Sir.");
});
overlay.addEventListener("click", (e) => { if (e.target === overlay) closeSettings(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSettings(); });

/* ================================================================
   Start
   ================================================================ */
function init() {
  sizeCanvas();
  requestAnimationFrame(drawReactor);
  applyLanguage();
  loadGoals();
  setState("idle");

  if (!getKey()) {
    addMessage("system", t("welcomeNoKey"));
  } else {
    addMessage("jarvis", t("welcome"));
  }
  setTimeout(sizeCanvas, 60);
}
init();
</script>
